name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: backend
        run: sh mvnw clean verify --no-transfer-progress
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/oceanview-frontend/package-lock.json
      - name: Install
        working-directory: frontend/oceanview-frontend
        run: npm ci
      - name: Lint
        working-directory: frontend/oceanview-frontend
        run: npm run lint --if-present || true
      - name: Build
        working-directory: frontend/oceanview-frontend
        run: npm run build