name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
            # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3 Build project
      - name: Build with Maven
        run: mvn -f oceanview/backend/pom.xml clean install --batch-mode

      # 4 Run tests
      - name: Run tests
        run: mvn -f oceanview/backend/pom.xml test

      # 5 Upload JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceanview-backend-jar
          path: oceanview/backend/target/*.jar