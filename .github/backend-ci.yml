# ============================================================
#  Ocean View Resort — Backend CI/CD Pipeline
#  File: .github/workflows/backend-ci.yml
#
#  Stack : Spring Boot 3.2 · Java 17 · Maven · MongoDB Atlas
#  Jobs  : build-and-test → docker → deploy
# ============================================================

name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'
  REGISTRY:     ghcr.io
  IMAGE_NAME:   ${{ github.repository }}/backend   # ghcr.io/<owner>/<repo>/backend

# ──────────────────────────────────────────────────────────
#  JOB 1 — Build & Unit-Test (Spring Boot / Maven)
# ──────────────────────────────────────────────────────────
jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend   # all `run` steps execute inside /backend

    steps:
      # 1. Pull source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install JDK 17 (Temurin) + restore Maven cache
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven                 # caches ~/.m2/repository between runs

      # 3. Compile & package the JAR (tests skipped here for speed)
      - name: Build with Maven
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      # 4. Run unit tests (MongoDB is mocked via @DataMongoTest / Flapdoodle)
      - name: Run unit tests
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.MONGODB_URI }}   # Atlas URI injected at test time
        run: ./mvnw test --batch-mode --no-transfer-progress

      # 5. Publish Surefire XML reports as a downloadable artifact
      - name: Upload test reports
        if: always()                   # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      # 6. (Optional) Publish code-coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

# ──────────────────────────────────────────────────────────
#  JOB 2 — Build & Push Docker Image (main branch only)
# ──────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test                         # only runs when job 1 passes
    if: github.ref == 'refs/heads/main'           # skip on PRs / develop

    permissions:
      contents: read
      packages: write                             # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract metadata (tags, labels) for the Docker image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-         # e.g. sha-a1b2c3d
            type=raw,value=latest

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image and push to ghcr.io
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context:  ./backend
          file:     ./backend/Dockerfile
          push:     true
          tags:     ${{ steps.meta.outputs.tags }}
          labels:   ${{ steps.meta.outputs.labels }}

# ──────────────────────────────────────────────────────────
#  JOB 3 — Deploy to Production (main branch only)
# ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker                                 # only runs when job 2 passes
    environment: production                       # enables GitHub approval gate

    steps:
      # Trigger your server to pull the new image via a webhook
      - name: Trigger deploy webhook
        run: |
          curl --fail -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
               -d '{"image":"ghcr.io/${{ env.IMAGE_NAME }}:latest","ref":"${{ github.sha }}"}'

      # Confirm the deployment completed
      - name: Confirm deployment
        run: echo "✅ Deployed ghcr.io/${{ env.IMAGE_NAME }}:latest — commit ${{ github.sha }}"